# Segundo "despertador" do Supabase gratuito (que pausa o projeto após 7 dias
# sem atividade). O primeiro é o cron do Vercel (vercel.json); este é o
# reserva, pra um não depender só do outro. Chama /api/keep-alive 1x por dia.
#
# Precisa de 1 variável no GitHub: Settings > Secrets and variables >
# Actions > Variables > SITE_URL (ex.: https://seu-site.vercel.app, sem
# barra no final).
#
# Atenção: o GitHub desliga workflows agendados depois de 60 dias sem
# nenhuma atividade no repositório (um commit já reativa).
name: keep-alive

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar /api/keep-alive
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "Variável SITE_URL não configurada."
            exit 1
          fi
          curl --fail --silent --show-error --max-time 60 --retry 3 --retry-delay 10 "$SITE_URL/api/keep-alive"
